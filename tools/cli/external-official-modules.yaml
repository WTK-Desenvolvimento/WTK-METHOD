# This file allows these modules under wtk-code-org to also be installed with the bmad method installer, while
# allowing us to keep the source of these projects in separate repos.

modules:
  wtk-builder:
    url: https://github.com/wtk-code-org/wtk-builder
    module-definition: src/module.yaml
    code: bmb
    name: "Wtk Builder"
    description: "Agent and Builder"
    defaultSelected: false
    type: wtk-org
    npmPackage: wtk-builder

  wtk-creative-intelligence-suite:
    url: https://github.com/wtk-code-org/wtk-module-creative-intelligence-suite
    module-definition: src/module.yaml
    code: cis
    name: "Wtk Creative Intelligence Suite"
    description: "Creative tools for writing, brainstorming, and more"
    defaultSelected: false
    type: wtk-org
    npmPackage: wtk-creative-intelligence-suite

  wtk-game-dev-studio:
    url: https://github.com/wtk-code-org/wtk-module-game-dev-studio.git
    module-definition: src/module.yaml
    code: gds
    name: "Wtk Game Dev Studio"
    description: "Game development agents and workflows"
    defaultSelected: false
    type: wtk-org
    npmPackage: wtk-game-dev-studio

  wtk-method-test-architecture-enterprise:
    url: https://github.com/wtk-code-org/wtk-method-test-architecture-enterprise
    module-definition: src/module.yaml
    code: tea
    name: "Test Architect"
    description: "Master Test Architect for quality strategy, test automation, and release gates"
    defaultSelected: false
    type: wtk-org
    npmPackage: wtk-method-test-architecture-enterprise

  whiteport-design-studio:
    url: https://github.com/wtk-code-org/wtk-method-wds-expansion
    module-definition: src/module.yaml
    code: wds
    name: "Whiteport Design Studio (For UX Professionals)"
    description: "Whiteport Design Studio (For UX Professionals)"
    defaultSelected: false
    type: community
    npmPackage: wtk-method-wds-expansion
